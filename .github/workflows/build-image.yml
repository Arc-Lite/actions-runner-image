name: Build Runner Image

on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: Runner version without the v prefix
        required: true
        default: '2.337.0'
        type: string
  push:
    paths:
      - Dockerfile
      - scripts/**
      - toolsets/**
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - Dockerfile
      - scripts/**
      - toolsets/**
      - .github/workflows/build-image.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUNNER_VERSION: ${{ inputs.runner_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Runner version
        shell: bash
        run: '[[ "$RUNNER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: actions-runner-image:${{ env.RUNNER_VERSION }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
            IMAGE_VERSION=${{ github.run_id }}.${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        shell: bash
        run: |
          image="actions-runner-image:$RUNNER_VERSION"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          test "$(docker run --rm --entrypoint /home/runner/bin/Runner.Listener "$image" --version)" = "$RUNNER_VERSION"
          docker run --rm --entrypoint bash "$image" -e -c '
            set -a
            source /etc/environment
            set +a
            test "$(id -u)" = 1001
            test -d /home/runner/k8s
            test -d /home/runner/k8s-novolume
            test "$ImageOS" = ubuntu24
            node --version
            python3 --version
            pwsh --version
            docker --version
            docker compose version
            docker buildx version
          '

      # - name: Export image
      #   shell: bash
