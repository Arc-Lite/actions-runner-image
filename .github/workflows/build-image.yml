name: Build Runner Image

on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: Runner version without the v prefix
        required: true
        default: '2.337.0'
        type: string
  push:
    paths:
      - Dockerfile
      - scripts/**
      - toolsets/**
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - Dockerfile
      - scripts/**
      - toolsets/**
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUNNER_VERSION: ${{ inputs.runner_version || '2.337.0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Runner version
        shell: bash
        run: '[[ "$RUNNER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tag
        id: image
        shell: bash
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:$RUNNER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
            IMAGE_VERSION=${{ github.run_id }}.${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
